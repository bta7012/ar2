<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wall Lamp AR — повесить светильник на стену</title>
<style>
  :root{--bg:#121214;--fg:#f3efe8;--muted:#9a958c;--accent:#ffb36b;--ok:#6be3a4;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* ---------- start screen ---------- */
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));gap:14px}
  #start h1{margin:8px 0 0;font-size:22px;font-weight:650;letter-spacing:.2px}
  #start p.sub{margin:0;color:var(--muted);font-size:14px;text-align:center;max-width:420px;line-height:1.45}
  model-viewer{flex:1;width:100%;max-width:520px;min-height:240px;background:
    radial-gradient(ellipse at 50% 45%,#2a2724 0%,#161517 70%);border-radius:18px;--poster-color:transparent}
  .btn{appearance:none;border:0;border-radius:14px;padding:15px 22px;font-size:16px;font-weight:600;
    background:var(--accent);color:#1b1309;width:100%;max-width:520px;cursor:pointer}
  .btn:disabled{opacity:.45}
  #support{font-size:13px;color:var(--muted);text-align:center;min-height:18px;max-width:520px}
  /* ---------- AR overlay ---------- */
  #overlay{position:fixed;inset:0;display:none;pointer-events:none}
  #overlay>*{pointer-events:auto}
  #status{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(18,18,20,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap;display:flex;gap:8px;align-items:center}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  #dot.ok{background:var(--ok)} #dot.bad{background:var(--bad)}
  #bar{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:10px;padding:0 12px}
  #bar button{appearance:none;border:0;border-radius:14px;min-width:64px;padding:10px 12px;
    background:rgba(18,18,20,.8);color:var(--fg);font-size:12px;display:flex;flex-direction:column;
    align-items:center;gap:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #bar button span{font-size:20px;line-height:1}
  #bar button.on{background:var(--accent);color:#1b1309}
  #bar button:disabled{opacity:.4}
  #help{position:absolute;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:12px;color:#e8e2d8;text-shadow:0 1px 3px #000;text-align:center;width:90%}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>

<section id="start">
  <h1>Настенный светильник в AR</h1>
  <p class="sub">Наведите камеру на стену, дождитесь зелёного прицела и коснитесь экрана — светильник повиснет на стене.</p>
  <model-viewer id="preview" camera-controls auto-rotate shadow-intensity="0.6" exposure="1"
      camera-orbit="25deg 80deg auto" ar ar-modes="scene-viewer quick-look" ar-placement="wall"
      alt="Настенный светильник">
    <button slot="ar-button" style="display:none"></button>
  </model-viewer>
  <button id="enter" class="btn" disabled>Проверяем поддержку AR…</button>
  <div id="support"></div>
</section>

<div id="overlay">
  <div id="status"><i id="dot"></i><b id="statusText">Запуск…</b></div>
  <div id="help">Тап — повесить · двумя пальцами — повернуть и масштабировать</div>
  <div id="bar">
    <button id="bUndo" disabled><span>↶</span>Отменить</button>
    <button id="bMove" disabled><span>✥</span>Сдвинуть</button>
    <button id="bLight" class="on"><span>💡</span>Свет</button>
    <button id="bExit"><span>✕</span>Выход</button>
  </div>
</div>

  ghostTemplate.traverse(o => { if (o.isMesh) o.material = ghostMat; });
  ghost.add(ghostTemplate);
}, err => console.error(err));

/* ================= three.js scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
renderer.domElement.style.display = 'none';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 30);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 0.8));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* soft textures drawn on canvas: contact shadow + warm light wash on the wall */
function radialTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadowTex = radialTexture([[0, 'rgba(0,0,0,0.55)'], [0.55, 'rgba(0,0,0,0.25)'], [1, 'rgba(0,0,0,0)']]);
const glowTex = radialTexture([[0, 'rgba(255,190,120,0.55)'], [0.35, 'rgba(255,160,90,0.22)'], [1, 'rgba(255,140,60,0)']]);
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

/* reticle: ring lying in the wall plane (local XY, normal +Z) */
const reticle = new THREE.Group();
const ringMat = new THREE.MeshBasicMaterial({ color: 0x6be3a4, transparent: true, opacity: 0.9, depthTest: false });
const ring = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.085, 48), ringMat);
const centerDot = new THREE.Mesh(new THREE.CircleGeometry(0.008, 16), ringMat);
ring.renderOrder = centerDot.renderOrder = 10;
reticle.add(ring, centerDot);
reticle.visible = false;
reticle.matrixAutoUpdate = true;
scene.add(reticle);

const ghost = new THREE.Group();   // translucent preview of the lamp on the wall
reticle.add(ghost);

/* ================= placement maths ================= */
const UP = new THREE.Vector3(0, 1, 0);
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _n = new THREE.Vector3(), _v = new THREE.Vector3();
const WALL_MAX_NY = 0.35;   // |normal.y| below this => vertical surface (≈ ±20° from vertical)

// Quaternion with +Z = wall normal and +Y = world-up projected onto the wall,
// so the lamp hangs plumb even if the detected plane is slightly tilted.
function wallQuaternion(normal, out) {
  const z = normal.clone().normalize();
  const y = UP.clone().addScaledVector(z, -UP.dot(z)).normalize();
  const x = new THREE.Vector3().crossVectors(y, z);
  return out.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}

/* ================= lamps ================= */
const lamps = [];
let active = null;
let lightOn = true;

function makeLamp() {
  const root = new THREE.Group();      // oriented to the wall
  const spin = new THREE.Group();      // rotation around wall normal + scale
  root.add(spin);
  const model = lampTemplate.clone(true);
  spin.add(model);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.74), shadowMat);
  shadow.position.z = 0.002;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.5), glowMat);
  glow.position.z = 0.003; glow.visible = lightOn;
  spin.add(shadow, glow);
  root.userData = { spin, glow };
  return root;
}

function setLight(on) {
  lightOn = on;
  if (diffuserMat) diffuserMat.emissiveIntensity = on ? 1 : 0;
  lamps.forEach(l => l.userData.glow.visible = on);
  bLight.classList.toggle('on', on);
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const startEl = $('start'), overlay = $('overlay'), enterBtn = $('enter'), supportEl = $('support');
const statusText = $('statusText'), dot = $('dot');
const bUndo = $('bUndo'), bMove = $('bMove'), bLight = $('bLight'), bExit = $('bExit');

function status(text, state) {
  if (statusText.textContent !== text) statusText.textContent = text;
  dot.className = state || '';
}
function refreshButtons() {
  bUndo.disabled = lamps.length === 0;
  bMove.disabled = !active;
  bMove.classList.toggle('on', moving);
}
// taps on overlay buttons must not also trigger XR "select" (= placing a lamp)
[bUndo, bMove, bLight, bExit, $('status')].forEach(el =>
  el.addEventListener('beforexrselect', e => e.preventDefault()));

bUndo.onclick = () => {
  const l = lamps.pop(); if (l) scene.remove(l);
  active = lamps[lamps.length - 1] || null; moving = false; refreshButtons();
};
bMove.onclick = () => { if (active) { moving = !moving; active.visible = !moving; refreshButtons(); } };
bLight.onclick = () => setLight(!lightOn);
bExit.onclick = () => xrSession && xrSession.end();

/* ================= support detection ================= */
let arSupported = false;
(async () => {
  try { arSupported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch {}
  enterBtn.disabled = false;
  if (arSupported) {
    enterBtn.textContent = 'Повесить на стену (AR)';
    supportEl.textContent = 'WebXR AR доступен ✓';
  } else {
    enterBtn.textContent = 'Открыть в AR';
    supportEl.textContent = window.isSecureContext
      ? 'WebXR не поддерживается — будет открыт системный AR-просмотрщик (Quick Look / Scene Viewer), если он есть.'
      : 'Нужен HTTPS: откройте страницу по защищённой ссылке на телефоне.';
  }
})();

enterBtn.onclick = async () => {
  if (arSupported) return startAR();
  await mv.updateComplete;
  if (mv.canActivateAR) mv.activateAR();
  else supportEl.textContent = 'AR на этом устройстве недоступен. Откройте страницу на Android (Chrome + ARCore) или iPhone (Safari).';
};

/* ================= WebXR session ================= */
let xrSession = null, hitSource = null, moving = false;
let currentWall = null;               // {p, q} of the latest valid wall hit
let gesture = null, lastGestureEnd = 0;

async function startAR() {
  if (!lampTemplate) { supportEl.textContent = 'Модель ещё загружается…'; return; }
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'plane-detection'],
      domOverlay: { root: overlay }
    });
  } catch (e) {
    supportEl.textContent = 'Не удалось запустить AR: ' + e.message; return;
  }
  overlay.style.display = 'block';
  startEl.style.display = 'none';
  renderer.domElement.style.display = 'block';
  await renderer.xr.setSession(xrSession);

  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  try {   // planes only: walls come from ARCore vertical plane detection
    hitSource = await xrSession.requestHitTestSource({ space: viewerSpace, entityTypes: ['plane'] });
  } catch {
    hitSource = await xrSession.requestHitTestSource({ space: viewerSpace });
  }

  xrSession.addEventListener('select', onSelect);
  xrSession.addEventListener('end', onEnd);
  status('Медленно поводите телефоном по стене…');
  setLight(lightOn); refreshButtons();
  renderer.setAnimationLoop(onFrame);
}

function onEnd() {
  renderer.setAnimationLoop(null);
  hitSource && hitSource.cancel(); hitSource = null; xrSession = null;
  lamps.splice(0).forEach(l => scene.remove(l)); active = null; moving = false;
  reticle.visible = false; currentWall = null;
  overlay.style.display = 'none'; renderer.domElement.style.display = 'none';
  startEl.style.display = 'flex';
}

function onSelect() {
  // a two-finger gesture also ends with a "select" — ignore it
  if (gesture || performance.now() - lastGestureEnd < 450) return;
  if (!currentWall) { status('Нужна стена — наведите прицел на вертикальную поверхность', 'bad'); return; }
  if (moving && active) {
    active.position.copy(currentWall.p); active.quaternion.copy(currentWall.q);
    active.visible = true; moving = false;
  } else {
    const lamp = makeLamp();
    lamp.position.copy(currentWall.p); lamp.quaternion.copy(currentWall.q);
    scene.add(lamp); lamps.push(lamp); active = lamp;
  }
  refreshButtons();
}

/* two-finger twist (rotate around wall normal) + pinch (scale) on the active lamp */
const touchInfo = t => {
  const dx = t[1].clientX - t[0].clientX, dy = t[1].clientY - t[0].clientY;
  return { d: Math.hypot(dx, dy), a: Math.atan2(dy, dx) };
};
overlay.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && active) {
    const { d, a } = touchInfo(e.touches), s = active.userData.spin;
    gesture = { d0: d, a0: a, s0: s.scale.x, r0: s.rotation.z };
  }
}, { passive: true });
overlay.addEventListener('touchmove', e => {
  if (!gesture || e.touches.length !== 2 || !active) return;
  const { d, a } = touchInfo(e.touches), s = active.userData.spin;
  s.scale.setScalar(THREE.MathUtils.clamp(gesture.s0 * d / gesture.d0, 0.4, 3));
  s.rotation.z = gesture.r0 - (a - gesture.a0);
}, { passive: true });
overlay.addEventListener('touchend', e => {
  if (gesture && e.touches.length < 2) { gesture = null; lastGestureEnd = performance.now(); }
}, { passive: true });

/* ================= per-frame wall tracking ================= */
const targetQ = new THREE.Quaternion();
function onFrame(time, frame) {
  if (frame && hitSource) {
    const ref = renderer.xr.getReferenceSpace();
    const viewer = frame.getViewerPose(ref);
    const results = frame.getHitTestResults(hitSource);
    let wall = null, other = false;

    for (const r of results) {
      const pose = r.getPose(ref); if (!pose) continue;
      _m.fromArray(pose.transform.matrix);
      _p.setFromMatrixPosition(_m);
      _n.setFromMatrixColumn(_m, 1).normalize();          // hit pose +Y = surface normal
      if (Math.abs(_n.y) < WALL_MAX_NY) {
        if (viewer) {                                       // make normal face the user
          const vp = viewer.transform.position;
          _v.set(vp.x, vp.y, vp.z).sub(_p);
          if (_v.dot(_n) < 0) _n.negate();
        }
        wall = { p: _p.clone(), q: wallQuaternion(_n, new THREE.Quaternion()) };
        break;
      }
      other = true;
    }

    if (wall) {
      // smooth the reticle to hide tracking jitter
      if (!reticle.visible) { reticle.position.copy(wall.p); reticle.quaternion.copy(wall.q); }
      reticle.position.lerp(wall.p, 0.35);
      reticle.quaternion.slerp(wall.q, 0.35);
      reticle.visible = true;
      ringMat.color.set(0x6be3a4);
      ghost.visible = true;
      currentWall = { p: reticle.position.clone(), q: reticle.quaternion.clone() };
      status(moving ? 'Коснитесь — переместить сюда' : 'Стена найдена — коснитесь, чтобы повесить', 'ok');
    } else {
      currentWall = null;
      ghost.visible = false;
      if (other && results.length) {                       // floor / table: red reticle
        const pose = results[0].getPose(ref);
        _m.fromArray(pose.transform.matrix);
        reticle.position.setFromMatrixPosition(_m);
        _n.setFromMatrixColumn(_m, 1);
        reticle.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), _n.normalize());
        reticle.visible = true; ringMat.color.set(0xff6b6b);
        status('Это не стена — наведите на вертикальную поверхность', 'bad');
      } else {
        reticle.visible = false;
        status('Ищем стену… поводите телефоном, нужна текстура/освещение');
      }
    }
  }
  renderer.render(scene, camera);
}
</script>
</body>
</html>
