name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 138.201.50.242
      SSH_PORT: "32308"
      SSH_USER: prjadm
      DEPLOY_PATH: /var/www/ar2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- CI: build + checks ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (esbuild bundle + gzip)
        run: npm run build

      - name: Validate dist
        run: |
          set -e
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          [ "$(head -c 4 dist/WallLamp_web.glb)" = "glTF" ] || { echo "::error::GLB is not binary glTF"; exit 1; }
          APP=$(grep -o 'app-[A-Z0-9]*\.js' dist/index.html | head -1)
          test -n "$APP" && test -f "dist/$APP" || { echo "::error::bundle not referenced from index.html"; exit 1; }
          node --check "dist/$APP"
          echo "${GITHUB_SHA}  $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.txt
          ls -la dist

      # ---------- CD: rsync over SSH ----------
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -e
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Secret SSH_PRIVATE_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set, trusting host key from ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -e
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          # --delay-updates: files are swapped in at the very end -> no half-updated site
          rsync -rlz --delete --delay-updates --chmod=D755,F644 \
            -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          $SSH "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_PATH/version.txt' && ls -la '$DEPLOY_PATH'"

      - name: Smoke test
        if: ${{ vars.SITE_URL != '' }}
        run: |
          curl -fsS "${{ vars.SITE_URL }}/version.txt"
          curl -fsSI "${{ vars.SITE_URL }}/WallLamp_web.glb" | grep -i '^content-type'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
